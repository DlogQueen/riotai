  <!-- hat crown -->
  <rect x="44" y="34" width="32" height="26" rx="3" fill="url(#hound)" stroke="#101010" stroke-width="1"/>
  <rect x="44" y="52" width="32" height="6" fill="#101010"/>

  <text x="60" y="98" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700"
        font-size="22" fill="#ffffff" letter-spacing="1">BB</text>
