<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🖤 RIOT AI</title>
    <link rel="icon" type="image/png" href="/static/logo.png">
    <link rel="apple-touch-icon" href="/static/logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/dracula.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/javascript/javascript.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Roboto+Mono:wght@400;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Roboto Mono', monospace;
            background: #000;
            background-image:
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,0,128,0.03) 2px, rgba(255,0,128,0.03) 4px),
                repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(0,255,159,0.03) 2px, rgba(0,255,159,0.03) 4px);
            height: 100vh;
            display: flex;
            flex-direction: column;
            color: #fff;
            overflow: hidden;
        }
        .toolbar {
            background: linear-gradient(135deg, #1a0010 0%, #001a10 100%);
            padding: 8px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #ff0080;
            box-shadow: 0 0 20px rgba(255,0,128,0.5), 0 0 40px rgba(0,255,159,0.3);
        }
        .logo {
            font-family: 'Permanent Marker', cursive;
            font-size: 26px;
            background: linear-gradient(135deg, #ff0080 0%, #00ff9f 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
            transform: rotate(-2deg);
            display: inline-block;
        }
        .logo:hover { animation: glitch 0.3s infinite; }
        @keyframes glitch {
            0%   { transform: translate(0) rotate(-2deg); }
            25%  { transform: translate(-2px, 2px) rotate(-2deg); }
            50%  { transform: translate(2px, -2px) rotate(-2deg); }
            75%  { transform: translate(-2px, -2px) rotate(-2deg); }
            100% { transform: translate(0) rotate(-2deg); }
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .toolbar-btn {
            padding: 9px 16px;
            background: #000;
            border: 2px solid #ff0080;
            color: #ff0080;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            font-family: 'Roboto Mono', monospace;
        }
        .toolbar-btn:hover { background: #ff0080; color: #000; box-shadow: 0 0 15px rgba(255,0,128,0.8); }
        .toolbar-btn.active { background: linear-gradient(135deg,#ff0080,#00ff9f); border-color: #00ff9f; color: #000; }
        .toolbar-btn.recording { background: #ff0000; border-color: #ff0000; color: #fff; animation: pulse 0.8s infinite; }
        .emotion-indicator {
            padding: 9px 16px; background: #000; border: 2px solid #00ff9f;
            font-size: 12px; display: flex; align-items: center; gap: 8px; font-weight: 700; text-transform: uppercase;
        }
        .emotion-dot { width: 10px; height: 10px; border-radius: 50%; animation: pulse 2s infinite; }
        .container { flex: 1; display: flex; overflow: hidden; }
        .sidebar {
            width: 260px; background: linear-gradient(180deg,#0a0005,#000a05);
            border-right: 3px solid #ff0080; display: flex; flex-direction: column;
            transition: width 0.3s; overflow: hidden;
        }
        .sidebar.collapsed { width: 0; }
        .sidebar-section { padding: 18px; border-bottom: 2px solid rgba(255,0,128,0.3); }
        .sidebar-title { font-size: 12px; color: #ff0080; text-transform: uppercase; font-weight: 700; margin-bottom: 12px; letter-spacing: 2px; }
        .persona-card {
            padding: 12px; background: #000; border: 2px solid #ff0080;
            cursor: pointer; transition: all 0.2s; margin-bottom: 10px;
        }
        .persona-card:hover { border-color: #00ff9f; box-shadow: 0 0 15px rgba(0,255,159,0.5); transform: translateX(4px); }
        .persona-card.active { background: linear-gradient(135deg,#ff0080,#00ff9f); border-color: #00ff9f; color: #000; }
        .persona-name { font-weight: 700; margin-bottom: 4px; font-size: 15px; }
        .persona-desc { font-size: 11px; opacity: 0.8; }
        .chat-container { flex: 1; display: flex; flex-direction: column; background: #000; }
        .chat-area { flex: 1; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; gap: 18px; }
        .message { display: flex; gap: 12px; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-15px); } to { opacity: 1; transform: translateX(0); } }
        .message.user { flex-direction: row-reverse; }
        .avatar {
            width: 46px; height: 46px; display: flex; align-items: center; justify-content: center;
            font-size: 26px; flex-shrink: 0; border: 2px solid;
        }
        .message.user .avatar { background: linear-gradient(135deg,#ff0080,#00ff9f); border-color: #00ff9f; }
        .message.assistant .avatar { background: #000; border-color: #ff0080; box-shadow: 0 0 15px rgba(255,0,128,0.4); }
        .message-content {
            max-width: 70%; padding: 16px 20px; line-height: 1.7; color: #fff;
            border: 2px solid; font-size: 14px;
        }
        .message.user .message-content { background: rgba(0,255,159,0.1); border-color: #00ff9f; }
        .message.assistant .message-content { background: rgba(255,0,128,0.08); border-color: #ff0080; }
        .message-content pre { background: #0a0a0a; padding: 12px; border: 1px solid #ff0080; overflow-x: auto; margin: 10px 0; }
        .message-content code { font-family: 'Roboto Mono', monospace; font-size: 13px; color: #00ff9f; }
        .message-content pre code { color: #00ff9f; }
        .input-area {
            padding: 20px; background: linear-gradient(135deg,#0a0005,#000a05);
            border-top: 3px solid #ff0080; display: flex; flex-direction: column; gap: 10px;
        }
        .input-tools { display: flex; gap: 8px; flex-wrap: wrap; }
        .tool-btn {
            padding: 7px 12px; background: #000; border: 1px solid #ff0080;
            color: #ff0080; cursor: pointer; font-size: 11px; transition: all 0.2s;
            font-weight: 700; text-transform: uppercase; font-family: 'Roboto Mono', monospace;
        }
        .tool-btn:hover { background: #ff0080; color: #000; }
        .input-row { display: flex; gap: 10px; }
        .input-box {
            flex: 1; padding: 16px 20px; background: #000; border: 2px solid #ff0080;
            color: #fff; font-size: 14px; resize: none; font-family: 'Roboto Mono', monospace; transition: border-color 0.2s;
        }
        .input-box:focus { outline: none; border-color: #00ff9f; box-shadow: 0 0 15px rgba(0,255,159,0.4); }
        .send-btn {
            padding: 16px 36px; background: linear-gradient(135deg,#ff0080,#00ff9f);
            border: none; color: #000; font-size: 15px; font-weight: 700; cursor: pointer;
            transition: all 0.2s; text-transform: uppercase; font-family: 'Roboto Mono', monospace; letter-spacing: 2px;
        }
        .send-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 25px rgba(255,0,128,0.7); }
        .send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 1000; align-items: center; justify-content: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #000; border: 3px solid #ff0080; width: 90%; max-width: 900px;
            max-height: 80vh; display: flex; flex-direction: column; box-shadow: 0 0 50px rgba(255,0,128,0.7);
        }
        .modal-header {
            padding: 18px 22px; border-bottom: 2px solid #ff0080;
            display: flex; justify-content: space-between; align-items: center;
            background: linear-gradient(135deg,#0a0005,#000a05);
        }
        .modal-body { flex: 1; overflow: hidden; }
        .CodeMirror { height: 420px; font-size: 14px; }
        .modal-footer {
            padding: 18px 22px; border-top: 2px solid #ff0080;
            display: flex; justify-content: flex-end; gap: 10px;
            background: linear-gradient(135deg,#0a0005,#000a05);
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(180deg,#ff0080,#00ff9f); }
        .tts-btn {
            background: none; border: none; cursor: pointer; font-size: 14px;
            opacity: 0.6; transition: opacity 0.2s; padding: 2px 6px;
        }
        .tts-btn:hover { opacity: 1; }
        #voice-status { font-size: 11px; color: #00ff9f; margin-left: 8px; }
    </style>
</head>
<body>

    <!-- Toolbar -->
    <div class="toolbar">
        <div style="display:flex;gap:16px;align-items:center;">
            <img src="/static/logo.png" alt="RIOT AI" style="height:54px;width:auto;object-fit:contain;filter:drop-shadow(0 0 8px rgba(255,0,128,0.8));cursor:pointer;" onclick="window.location.reload()" title="RIOT AI">
            <button class="toolbar-btn" onclick="toggleSidebar()">☰</button>
            <button class="toolbar-btn" onclick="openCodeEditor()">💻 CODE</button>
            <button class="toolbar-btn" id="voice-btn" onclick="toggleVoice()">🎤 VOICE</button>
            <span id="voice-status"></span>
            <button class="toolbar-btn" onclick="startCamera()">📷 VISION</button>
        </div>
        <div style="display:flex;gap:12px;align-items:center;">
            <div class="emotion-indicator">
                <div class="emotion-dot" id="emotion-dot" style="background:#00ff9f;"></div>
                <span id="emotion-text">NEUTRAL</span>
            </div>
            <select class="toolbar-btn" id="model-select" style="padding:9px 12px;">
                <option value="cloud">☁️ GPT-4O</option>
                <option value="local">💻 TINYLLAMA</option>
            </select>
        </div>
    </div>

    <!-- Main -->
    <div class="container">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-section">
                <div class="sidebar-title">🖤 YOUR CREW</div>
                <div class="persona-card active" data-persona="raven">
                    <div class="persona-name">🦇 RAVEN</div>
                    <div class="persona-desc">Sassy punk rock queen</div>
                </div>
                <div class="persona-card" data-persona="riot">
                    <div class="persona-name">💀 RIOT</div>
                    <div class="persona-desc">Emo skater rebel</div>
                </div>
            </div>
            <div class="sidebar-section">
                <div class="sidebar-title">⚡ QUICK ACTIONS</div>
                <button class="toolbar-btn" style="width:100%;margin-bottom:8px;" onclick="clearHistory()">🗑️ CLEAR CHAT</button>
                <button class="toolbar-btn" style="width:100%;margin-bottom:8px;" onclick="exportChat()">💾 EXPORT</button>
                <button class="toolbar-btn" style="width:100%;" onclick="loadHistory()">📜 LOAD HISTORY</button>
            </div>
            <div class="sidebar-section">
                <div class="sidebar-title">🧠 MEMORY</div>
                <button class="toolbar-btn" style="width:100%;margin-bottom:8px;" onclick="showMemory()">👁️ VIEW ALL</button>
                <div id="memory-preview" style="font-size:10px;color:#aaa;line-height:1.6;max-height:120px;overflow-y:auto;"></div>
            </div>
            <div class="sidebar-section">
                <div class="sidebar-title">🔌 N8N STATUS</div>
                <button class="toolbar-btn" style="width:100%;" onclick="checkN8n()">⚡ CHECK TOOLS</button>
                <div id="n8n-status" style="font-size:11px;color:#00ff9f;margin-top:8px;"></div>
            </div>
        </div>

        <div class="chat-container">
            <div class="chat-area" id="chat-area">
                <div class="message assistant">
                    <div class="avatar">🦇</div>
                    <div class="message-content">
                        Yo! I'm Raven, your punk rock AI partner. Ready to break some rules and build something sick? Let's fucking go! 🖤⚡
                        <button class="tts-btn" onclick="speakText(this)" data-text="Yo! I'm Raven, your punk rock AI partner. Ready to break some rules and build something sick? Let's fucking go!">🔊</button>
                    </div>
                </div>
            </div>

            <div class="input-area">
                <div class="input-tools">
                    <button class="tool-btn" onclick="insertCode()">📝 CODE</button>
                    <button class="tool-btn" onclick="insertEmoji()">🖤 EMOJI</button>
                    <label class="tool-btn" style="cursor:pointer;">
                        📎 FILE <input type="file" id="file-input" style="display:none;" onchange="attachFile(this)">
                    </label>
                    <button class="tool-btn" onclick="uploadImage()">🖼️ IMAGE</button>
                </div>
                <div class="input-row">
                    <textarea class="input-box" id="message-input"
                        placeholder="Type your message... (Enter to send, Shift+Enter for new line)"
                        rows="1"></textarea>
                    <button class="send-btn" id="send-btn" onclick="sendMessage()">SEND ⚡</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Code Editor Modal -->
    <div class="modal" id="code-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 style="font-family:'Permanent Marker',cursive;color:#ff0080;">💻 CODE EDITOR</h3>
                <button class="toolbar-btn" onclick="closeCodeEditor()">✕ CLOSE</button>
            </div>
            <div class="modal-body">
                <textarea id="code-editor"></textarea>
            </div>
            <div class="modal-footer">
                <select id="code-language" class="toolbar-btn">
                    <option value="python">PYTHON</option>
                    <option value="javascript">JAVASCRIPT</option>
                </select>
                <button class="toolbar-btn" onclick="insertCodeToChat()">📤 INSERT TO CHAT</button>
                <button class="toolbar-btn" onclick="runCode()">▶️ RUN</button>
            </div>
        </div>
    </div>

    <!-- Hidden image upload -->
    <input type="file" id="image-input" accept="image/*" style="display:none;" onchange="analyzeImage(this)">

    <!-- Memory Modal -->
    <div class="modal" id="memory-modal">
        <div class="modal-content" style="max-width:700px;">
            <div class="modal-header">
                <h3 style="font-family:'Permanent Marker',cursive;color:#ff0080;">🧠 MEMORY BANK</h3>
                <button class="toolbar-btn" onclick="document.getElementById('memory-modal').classList.remove('active')">✕ CLOSE</button>
            </div>
            <div class="modal-body" style="padding:20px;overflow-y:auto;max-height:500px;" id="memory-content">
                <p style="color:#aaa;">Loading...</p>
            </div>
        </div>
    </div>

    <!-- Memory saved toast -->
    <div id="memory-toast" style="
        position:fixed;bottom:30px;right:30px;
        background:linear-gradient(135deg,#ff0080,#00ff9f);
        color:#000;padding:12px 20px;font-weight:700;font-size:13px;
        font-family:'Roboto Mono',monospace;
        display:none;z-index:9999;
        box-shadow:0 0 20px rgba(255,0,128,0.8);
        animation:slideInRight 0.3s ease;
    ">🧠 MEMORY SAVED</div>

    <!-- Camera Modal -->
    <div class="modal" id="camera-modal">
        <div class="modal-content" style="max-width:640px;">
            <div class="modal-header">
                <h3 style="font-family:'Permanent Marker',cursive;color:#ff0080;">📷 CAMERA</h3>
                <button class="toolbar-btn" onclick="closeCamera()">✕ CLOSE</button>
            </div>
            <div class="modal-body" style="background:#000;display:flex;align-items:center;justify-content:center;padding:10px;">
                <video id="camera-preview" autoplay playsinline
                    style="width:100%;max-height:400px;border:2px solid #ff0080;display:block;"></video>
            </div>
            <div class="modal-footer">
                <button class="toolbar-btn" onclick="closeCamera()">✕ CANCEL</button>
                <button class="send-btn" style="padding:12px 28px;" onclick="captureAndAnalyze()">📸 SNAP + ANALYZE</button>
            </div>
        </div>
    </div>


    <script>
        let currentPersona = 'raven';
        let currentModel = 'cloud';
        let codeEditor = null;
        let currentEmotion = 'neutral';

        // ── Voice Recording (MediaRecorder → Whisper) ──────────────────────
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;

        async function toggleVoice() {
            if (isRecording) {
                stopRecording();
            } else {
                await startRecording();
            }
        }

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioChunks = [];
                mediaRecorder = new MediaRecorder(stream);

                mediaRecorder.ondataavailable = e => {
                    if (e.data.size > 0) audioChunks.push(e.data);
                };

                mediaRecorder.onstop = async () => {
                    stream.getTracks().forEach(t => t.stop());
                    const blob = new Blob(audioChunks, { type: 'audio/webm' });
                    await transcribeAudio(blob);
                };

                mediaRecorder.start();
                isRecording = true;
                document.getElementById('voice-btn').classList.add('recording');
                document.getElementById('voice-btn').textContent = '⏹ STOP';
                document.getElementById('voice-status').textContent = '● REC';
            } catch (err) {
                alert('Mic access denied: ' + err.message);
            }
        }

        function stopRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                document.getElementById('voice-btn').classList.remove('recording');
                document.getElementById('voice-btn').textContent = '🎤 VOICE';
                document.getElementById('voice-status').textContent = '⏳ transcribing...';
            }
        }

        async function transcribeAudio(blob) {
            try {
                const formData = new FormData();
                formData.append('audio', blob, 'recording.webm');

                const resp = await fetch('/api/voice/transcribe', { method: 'POST', body: formData });
                const data = await resp.json();

                document.getElementById('voice-status').textContent = '';

                if (data.success && data.text) {
                    document.getElementById('message-input').value = data.text;
                    document.getElementById('message-input').style.height = 'auto';
                    document.getElementById('message-input').style.height =
                        Math.min(document.getElementById('message-input').scrollHeight, 150) + 'px';
                } else {
                    alert('Transcription failed: ' + (data.error || 'unknown'));
                }
            } catch (err) {
                document.getElementById('voice-status').textContent = '';
                alert('Transcription error: ' + err.message);
            }
        }

        // ── TTS ─────────────────────────────────────────────────────────────
        async function speakText(btn) {
            // Use data-text attribute - set when button is created
            const text = btn.dataset.text;
            if (!text || !text.trim()) return;
            try {
                btn.textContent = '⏳';
                btn.disabled = true;
                const resp = await fetch('/api/voice/speak', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text.trim().slice(0, 500), persona: currentPersona })
                });
                if (!resp.ok) {
                    const err = await resp.json().catch(() => ({}));
                    console.error('TTS failed:', err);
                    btn.textContent = '🔊';
                    btn.disabled = false;
                    return;
                }
                const audioBlob = await resp.blob();
                const url = URL.createObjectURL(audioBlob);
                const audio = new Audio(url);
                audio.onended = () => {
                    btn.textContent = '🔊';
                    btn.disabled = false;
                    URL.revokeObjectURL(url);
                };
                audio.onerror = (e) => {
                    console.error('Audio playback error:', e);
                    btn.textContent = '🔊';
                    btn.disabled = false;
                };
                await audio.play();
            } catch (err) {
                btn.textContent = '🔊';
                btn.disabled = false;
                console.error('TTS error:', err);
            }
        }

        // ── Camera / Vision (browser getUserMedia - no opencv needed) ────────
        let cameraStream = null;

        async function startCamera() {
            // Show camera modal
            document.getElementById('camera-modal').classList.add('active');
            try {
                cameraStream = await navigator.mediaDevices.getUserMedia({ video: true });
                document.getElementById('camera-preview').srcObject = cameraStream;
            } catch (err) {
                document.getElementById('camera-modal').classList.remove('active');
                addMessage('assistant', '📷 Camera access denied: ' + err.message);
            }
        }

        function closeCamera() {
            if (cameraStream) {
                cameraStream.getTracks().forEach(t => t.stop());
                cameraStream = null;
            }
            document.getElementById('camera-modal').classList.remove('active');
        }

        async function captureAndAnalyze() {
            const video = document.getElementById('camera-preview');
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);

            closeCamera();

            canvas.toBlob(async (blob) => {
                addMessage('user', '📷 [Camera snapshot]');
                const formData = new FormData();
                formData.append('image', blob, 'snapshot.jpg');
                formData.append('prompt', 'Describe what you see with punk rock energy and attitude.');
                try {
                    const resp = await fetch('/api/vision/analyze', { method: 'POST', body: formData });
                    const data = await resp.json();
                    addMessage('assistant', data.success ? '👁️ ' + data.analysis : '❌ ' + data.error);
                } catch (err) {
                    addMessage('assistant', '❌ ' + err.message);
                }
            }, 'image/jpeg', 0.9);
        }

        function uploadImage() {
            document.getElementById('image-input').click();
        }

        async function analyzeImage(input) {
            if (!input.files[0]) return;
            const formData = new FormData();
            formData.append('image', input.files[0]);
            formData.append('prompt', 'Describe this image with punk rock energy and attitude.');
            addMessage('user', '🖼️ [Image uploaded]');
            try {
                const resp = await fetch('/api/vision/analyze', { method: 'POST', body: formData });
                const data = await resp.json();
                addMessage('assistant', data.success ? '👁️ ' + data.analysis : '❌ ' + data.error);
            } catch (err) {
                addMessage('assistant', '❌ ' + err.message);
            }
            input.value = '';
        }

        // ── Emotion ─────────────────────────────────────────────────────────
        function updateEmotion(emotion) {
            currentEmotion = emotion;
            const colors = { happy:'#00ff9f', sad:'#0080ff', angry:'#ff0000', neutral:'#00ff9f', excited:'#ff0080', anxious:'#ffaa00' };
            const labels = { happy:'HAPPY 😊', sad:'SAD 😢', angry:'ANGRY 😠', neutral:'NEUTRAL 😐', excited:'EXCITED 🎉', anxious:'ANXIOUS 😬' };
            document.getElementById('emotion-dot').style.background = colors[emotion] || '#00ff9f';
            document.getElementById('emotion-text').textContent = labels[emotion] || 'NEUTRAL';
        }

        function detectTextEmotion(text) {
            const lower = text.toLowerCase();
            if (/happy|great|awesome|sick|dope|rad|love|stoked/.test(lower)) updateEmotion('happy');
            else if (/sad|depressed|down|bummed|crying/.test(lower)) updateEmotion('sad');
            else if (/angry|pissed|mad|furious/.test(lower)) updateEmotion('angry');
            else if (/excited|pumped|hyped|omg/.test(lower)) updateEmotion('excited');
            else if (/worried|anxious|nervous|stressed/.test(lower)) updateEmotion('anxious');
            else updateEmotion('neutral');
        }

        // ── N8N ─────────────────────────────────────────────────────────────
        async function checkN8n() {
            document.getElementById('n8n-status').textContent = 'Connecting...';
            try {
                const resp = await fetch('/api/n8n/tools');
                const data = await resp.json();
                const tools = data.result?.tools || [];
                document.getElementById('n8n-status').textContent =
                    tools.length ? `✅ ${tools.length} tools available` : '⚠️ Connected (no tools listed)';
            } catch (err) {
                document.getElementById('n8n-status').textContent = '❌ ' + err.message;
            }
        }

        // ── Chat ─────────────────────────────────────────────────────────────
        async function sendMessage() {
            const input = document.getElementById('message-input');
            const message = input.value.trim();
            if (!message) return;

            detectTextEmotion(message);
            addMessage('user', message);
            input.value = '';
            input.style.height = 'auto';

            const sendBtn = document.getElementById('send-btn');
            sendBtn.disabled = true;
            sendBtn.textContent = '...';

            try {
                const resp = await fetch('/api/chat/stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message, persona: currentPersona, model: currentModel, emotion: currentEmotion })
                });

                const reader = resp.body.getReader();
                const decoder = new TextDecoder();
                let assistantMessage = '';
                let messageEl = null;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    const lines = decoder.decode(value).split('\n');
                    for (const line of lines) {
                        if (!line.startsWith('data: ')) continue;
                        try {
                            const data = JSON.parse(line.slice(6));
                            if (data.content) {
                                assistantMessage += data.content;
                                if (!messageEl) {
                                    messageEl = addMessage('assistant', assistantMessage);
                                } else {
                                    messageEl.querySelector('.message-content').innerHTML =
                                        formatMessage(assistantMessage) + ttsButton(assistantMessage);
                                }
                            }
                            if (data.memory_saved) {
                                showMemoryToast(data.key);
                                loadMemoryPreview();
                            }
                        } catch (_) {}
                    }
                }
            } catch (err) {
                addMessage('assistant', '❌ Error: ' + err.message);
            }

            sendBtn.disabled = false;
            sendBtn.textContent = 'SEND ⚡';
        }

        // Store TTS text in a map to avoid HTML encoding issues
        const ttsTextMap = {};
        let ttsCounter = 0;

        function ttsButton(text) {
            const id = 'tts_' + (ttsCounter++);
            ttsTextMap[id] = text.replace(/```[\s\S]*?```/g, '').replace(/<[^>]+>/g, '').trim().slice(0, 500);
            return `<button class="tts-btn" onclick="speakById('${id}')">🔊</button>`;
        }

        async function speakById(id) {
            const text = ttsTextMap[id];
            if (!text) return;
            const btn = event.target;
            try {
                btn.textContent = '⏳';
                btn.disabled = true;
                const resp = await fetch('/api/voice/speak', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, persona: currentPersona })
                });
                if (!resp.ok) {
                    const errData = await resp.json().catch(() => ({}));
                    console.error('TTS error:', errData);
                    btn.textContent = '🔊'; btn.disabled = false;
                    return;
                }
                const blob = await resp.blob();
                const url = URL.createObjectURL(blob);
                const audio = new Audio(url);
                audio.onended = () => { btn.textContent = '🔊'; btn.disabled = false; URL.revokeObjectURL(url); };
                audio.onerror = () => { btn.textContent = '🔊'; btn.disabled = false; };
                await audio.play();
            } catch (err) {
                btn.textContent = '🔊'; btn.disabled = false;
                console.error('TTS error:', err);
            }
        }

        function formatMessage(content) {
            content = content.replace(/```(\w+)?\n([\s\S]*?)```/g, (_, lang, code) =>
                `<pre><code>${escapeHtml(code)}</code></pre>`);
            content = content.replace(/`([^`]+)`/g, '<code>$1</code>');
            content = content.replace(/\n/g, '<br>');
            return content;
        }

        function escapeHtml(text) {
            const d = document.createElement('div');
            d.textContent = text;
            return d.innerHTML;
        }

        function addMessage(role, content) {
            const chatArea = document.getElementById('chat-area');
            const div = document.createElement('div');
            div.className = `message ${role}`;
            const avatar = role === 'user' ? '👤' : (currentPersona === 'raven' ? '🦇' : '💀');
            const tts = role === 'assistant' ? ttsButton(content) : '';
            div.innerHTML = `<div class="avatar">${avatar}</div>
                <div class="message-content">${formatMessage(content)}${tts}</div>`;
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
            return div;
        }

        // ── History ──────────────────────────────────────────────────────────
        async function loadHistory() {
            const resp = await fetch('/api/history');
            const history = await resp.json();
            const chatArea = document.getElementById('chat-area');
            chatArea.innerHTML = '';
            history.forEach(msg => addMessage(msg.role, msg.content));
        }

        async function clearHistory() {
            if (!confirm('Clear all chat history?')) return;
            await fetch('/api/history/clear', { method: 'POST' });
            document.getElementById('chat-area').innerHTML = '';
            addMessage('assistant', 'History cleared. Fresh start! 🖤');
        }

        function exportChat() {
            const msgs = [...document.querySelectorAll('.message')].map(m => {
                const role = m.classList.contains('user') ? 'YOU' : currentPersona.toUpperCase();
                return `[${role}] ${m.querySelector('.message-content').innerText.replace('🔊','').trim()}`;
            }).join('\n\n');
            const blob = new Blob([msgs], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `riot-ai-chat-${Date.now()}.txt`;
            a.click();
        }

        // ── Code Editor ──────────────────────────────────────────────────────
        function initCodeEditor() {
            if (!codeEditor) {
                codeEditor = CodeMirror.fromTextArea(document.getElementById('code-editor'), {
                    mode: 'python', theme: 'dracula', lineNumbers: true,
                    autoCloseBrackets: true, matchBrackets: true
                });
            }
        }

        function openCodeEditor() {
            document.getElementById('code-modal').classList.add('active');
            initCodeEditor();
        }

        function closeCodeEditor() {
            document.getElementById('code-modal').classList.remove('active');
        }

        function insertCodeToChat() {
            const code = codeEditor.getValue();
            const lang = document.getElementById('code-language').value;
            document.getElementById('message-input').value += `\n\`\`\`${lang}\n${code}\n\`\`\`\n`;
            closeCodeEditor();
        }

        function runCode() {
            const code = codeEditor.getValue();
            const lang = document.getElementById('code-language').value;
            document.getElementById('message-input').value = `Run this ${lang} code:\n\`\`\`${lang}\n${code}\n\`\`\``;
            closeCodeEditor();
            sendMessage();
        }

        // ── Misc ─────────────────────────────────────────────────────────────
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('collapsed');
        }

        function insertCode() {
            const input = document.getElementById('message-input');
            input.value += '\n```python\n\n```\n';
        }

        function insertEmoji() {
            const emojis = ['🖤','⚡','💀','🦇','🛹','🎸','🔥','💣','🌙','✨','🖤','💔'];
            document.getElementById('message-input').value += emojis[Math.floor(Math.random() * emojis.length)];
        }

        function attachFile(input) {
            if (!input.files[0]) return;
            const reader = new FileReader();
            reader.onload = e => {
                document.getElementById('message-input').value += `\n[File: ${input.files[0].name}]\n${e.target.result}\n`;
            };
            reader.readAsText(input.files[0]);
            input.value = '';
        }

        // ── Init ─────────────────────────────────────────────────────────────
        document.querySelectorAll('.persona-card').forEach(card => {
            card.addEventListener('click', () => {
                document.querySelectorAll('.persona-card').forEach(c => c.classList.remove('active'));
                card.classList.add('active');
                currentPersona = card.dataset.persona;
            });
        });

        document.getElementById('model-select').addEventListener('change', e => {
            currentModel = e.target.value;
        });

        const inputEl = document.getElementById('message-input');
        inputEl.addEventListener('input', () => {
            inputEl.style.height = 'auto';
            inputEl.style.height = Math.min(inputEl.scrollHeight, 150) + 'px';
        });
        inputEl.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        });
    </script>
</body>
</html>
