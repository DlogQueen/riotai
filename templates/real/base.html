<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}RAW{% endblock %}</title>
<style>
  :root{
    --ink:#e8e3dc; --ink-dim:#9a938a; --ink-faint:#6b655e;
    --bg:#14120f; --panel:#1c1915; --line:#2c2823;
    --accent:#c4553d; --ok:#6f9b74;
    --serif: "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --sans: ui-sans-serif,-apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans);
    font-size:15px; line-height:1.5;
    background-image:radial-gradient(rgba(255,255,255,.018) 1px, transparent 1px);
    background-size:3px 3px;
  }
  a{color:inherit}
  .wrap{max-width:660px; margin:0 auto; padding:0 18px 90px}

  /* ── masthead ── */
  header.top{
    border-bottom:1px solid var(--line); background:rgba(20,18,15,.92);
    backdrop-filter:blur(8px); position:sticky; top:0; z-index:20;
  }
  .top-in{max-width:660px; margin:0 auto; padding:12px 18px; display:flex; align-items:center; gap:14px}
  .brand{font-family:var(--serif); font-size:22px; letter-spacing:.14em; text-decoration:none; font-weight:700}
  .brand b{color:var(--accent)}
  .brand small{display:block; font-family:var(--sans); font-size:9.5px; letter-spacing:.22em;
    color:var(--ink-faint); text-transform:uppercase; margin-top:-2px}
  nav.top-nav{margin-left:auto; display:flex; gap:16px; align-items:center; font-size:13px}
  nav.top-nav a{color:var(--ink-dim); text-decoration:none; padding-bottom:2px; border-bottom:1px solid transparent}
  nav.top-nav a:hover{color:var(--ink); border-bottom-color:var(--accent)}
  nav.top-nav form.inline{display:flex; align-items:center}
  .linkbtn{background:none; border:0; color:var(--ink-faint); font:inherit; font-size:13px;
    line-height:1.35; cursor:pointer; padding:0}
  .linkbtn:hover{color:var(--accent)}

  /* ── bits ── */
  .avatar{
    width:38px; height:38px; flex:0 0 38px; border-radius:3px; display:grid; place-items:center;
    font-family:var(--serif); font-size:17px; color:#120f0d; font-weight:700; text-decoration:none;
  }
  .avatar.lg{width:64px; height:64px; flex-basis:64px; font-size:28px}
  .state-chip{
    display:inline-flex; align-items:center; gap:5px; font-size:11px; letter-spacing:.09em;
    text-transform:uppercase; padding:3px 8px; border:1px solid; border-radius:2px; white-space:nowrap;
  }
  .muted{color:var(--ink-dim)}
  .faint{color:var(--ink-faint)}
  .tiny{font-size:12px}

  .btn{
    font:inherit; font-size:13px; padding:8px 15px; border-radius:2px; cursor:pointer;
    border:1px solid var(--line); background:var(--panel); color:var(--ink);
  }
  .btn:hover{border-color:var(--ink-faint)}
  .btn.solid{background:var(--accent); border-color:var(--accent); color:#150f0d; font-weight:600}
  .btn.solid:hover{filter:brightness(1.1)}

  textarea, input[type=text], input[type=email], input[type=password], select{
    width:100%; font:inherit; background:#100e0c; color:var(--ink);
    border:1px solid var(--line); border-radius:2px; padding:10px 12px; resize:vertical;
  }
  textarea:focus, input:focus, select:focus{outline:none; border-color:var(--accent)}
  label.field{display:block; margin:16px 0 6px; font-size:12px; letter-spacing:.1em;
    text-transform:uppercase; color:var(--ink-dim)}
  label.field span{text-transform:none; letter-spacing:0; color:var(--ink-faint); font-size:12px}

  .flash{border-left:3px solid var(--accent); background:var(--panel); padding:10px 14px; margin:16px 0; font-size:14px}

  /* ── post ── */
  .post{border-bottom:1px solid var(--line); padding:20px 0 16px}
  .post-head{display:flex; gap:12px; align-items:flex-start}
  .post-head .who{min-width:0; flex:1}
  .name{font-weight:600; text-decoration:none}
  .name:hover{color:var(--accent)}
  .body{font-family:var(--serif); font-size:17.5px; line-height:1.62; white-space:pre-wrap;
    word-wrap:break-word; margin:12px 0 0; padding-left:6px; border-left:2px solid var(--line)}
  .reactions{display:flex; flex-wrap:wrap; gap:7px; margin-top:14px}
  .react{
    font:inherit; font-size:12px; padding:5px 10px; border-radius:2px; cursor:pointer;
    background:transparent; border:1px solid var(--line); color:var(--ink-dim);
  }
  .react:hover{border-color:var(--ink-faint); color:var(--ink)}
  .react.on{border-color:var(--accent); color:var(--ink); background:rgba(196,85,61,.12)}
  .react .n{color:var(--accent); font-weight:600; margin-left:3px}
  .thread{margin:14px 0 0 12px; padding-left:14px; border-left:1px solid var(--line)}
  .cmt{padding:8px 0; font-size:14px}
  .cmt-body{white-space:pre-wrap; word-wrap:break-word}
  form.inline{display:inline}

  .note{font-size:12.5px; color:var(--ink-faint); border-top:1px solid var(--line);
    margin-top:36px; padding-top:14px; line-height:1.7}
  h1.page{font-family:var(--serif); font-size:26px; margin:26px 0 4px}
  .sub{color:var(--ink-dim); font-size:13.5px; margin-bottom:20px}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <a class="brand" href="{{ url_for('real.feed') if me else url_for('real.landing') }}">
      RA<b>W</b><small>real life only</small>
    </a>
    {% if me %}
    <nav class="top-nav">
      <a href="{{ url_for('real.feed') }}">Feed</a>
      <a href="{{ url_for('real.everyone') }}">Everyone</a>
      <a href="{{ url_for('real.people') }}">People</a>
      <a href="{{ url_for('real.profile', handle=me.handle) }}">You</a>
      <form class="inline" method="post" action="{{ url_for('real.logout') }}">
        <button class="linkbtn" type="submit">Out</button>
      </form>
    </nav>
    {% else %}
    <nav class="top-nav">
      <a href="{{ url_for('real.login') }}">Log in</a>
      <a href="{{ url_for('real.join') }}">Join</a>
    </nav>
    {% endif %}
  </div>
</header>

<div class="wrap">
  {% with msgs = get_flashed_messages() %}
    {% for m in msgs %}<div class="flash">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</div>

</body>
</html>
